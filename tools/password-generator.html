<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Генератор пароля</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #0b0f19;
      color: #ffffff;

      font-family:
        Arial,
        sans-serif;
    }

    .card {
      width: min(460px, calc(100% - 32px));

      padding: 28px;

      background: #151c2c;
      border: 1px solid #263149;
      border-radius: 20px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 24px;
    }

    .description {
      margin: 0 0 24px;
      color: #9ca8bd;
      line-height: 1.5;
    }

    label {
      display: block;
      margin-bottom: 8px;

      font-size: 14px;
      font-weight: 600;
      color: #cbd5e1;
    }

    input {
      width: 100%;

      padding: 13px 14px;

      border: 1px solid #34415c;
      border-radius: 12px;

      background: #0f1522;
      color: white;

      outline: none;
      font-size: 16px;
    }

    input:focus {
      border-color: #3b82f6;
    }

    button {
      width: 100%;
      margin-top: 18px;

      padding: 13px 16px;

      border: 0;
      border-radius: 12px;

      background: #3b82f6;
      color: white;

      font-size: 15px;
      font-weight: 700;

      cursor: pointer;
    }

    button:hover {
      filter: brightness(1.08);
    }

    .result {
      margin-top: 22px;
      padding: 16px;

      background: #0f1522;
      border: 1px solid #263149;
      border-radius: 14px;
    }

    .result-row {
      margin-bottom: 14px;
    }

    .result-row:last-child {
      margin-bottom: 0;
    }

    .result-title {
      margin-bottom: 6px;

      color: #8fa0ba;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .05em;
    }

    .result-value {
      padding: 10px;

      background: #151c2c;
      border-radius: 8px;

      word-break: break-all;

      font-family: monospace;
      font-size: 13px;
    }

    .hidden {
      display: none;
    }

    .status {
      margin-top: 14px;

      color: #9ca8bd;
      font-size: 13px;
      text-align: center;
    }
  </style>
</head>

<body>

  <div class="card">

    <h1>🔐 Генератор пароля</h1>

    <p class="description">
      Введи пароль ученика.
      Пароль останется только на твоём компьютере —
      в Firebase попадут только hash и salt.
    </p>

    <label for="password">
      Пароль ученика
    </label>

    <input
      id="password"
      type="password"
      placeholder="Введи пароль"
      autocomplete="off"
    >

    <button id="generate-btn">
      Сгенерировать hash
    </button>

    <div
      id="status"
      class="status"
    ></div>

    <div
      id="result"
      class="result hidden"
    >

      <div class="result-row">
        <div class="result-title">
          passwordSalt
        </div>

        <div
          id="salt-output"
          class="result-value"
        ></div>
      </div>

      <div class="result-row">
        <div class="result-title">
          passwordHash
        </div>

        <div
          id="hash-output"
          class="result-value"
        ></div>
      </div>

    </div>

  </div>

  <script>

    const ITERATIONS = 600000;

    const passwordInput =
      document.getElementById(
        'password'
      );

    const generateBtn =
      document.getElementById(
        'generate-btn'
      );

    const status =
      document.getElementById(
        'status'
      );

    const result =
      document.getElementById(
        'result'
      );

    const saltOutput =
      document.getElementById(
        'salt-output'
      );

    const hashOutput =
      document.getElementById(
        'hash-output'
      );


    function bytesToBase64(bytes) {

      let binary = '';

      for (const byte of bytes) {
        binary += String.fromCharCode(
          byte
        );
      }

      return btoa(binary);
    }


    async function hashPassword(
      password
    ) {

      const encoder =
        new TextEncoder();

      const passwordBytes =
        encoder.encode(password);

      const salt =
        crypto.getRandomValues(
          new Uint8Array(16)
        );

      const key =
        await crypto.subtle.importKey(
          'raw',
          passwordBytes,
          {
            name: 'PBKDF2'
          },
          false,
          [
            'deriveBits'
          ]
        );

      const derivedBits =
        await crypto.subtle.deriveBits(
          {
            name: 'PBKDF2',
            salt,
            iterations: ITERATIONS,
            hash: 'SHA-256'
          },
          key,
          256
        );

      const hash =
        new Uint8Array(
          derivedBits
        );

      return {
        salt: bytesToBase64(salt),
        hash: bytesToBase64(hash)
      };
    }


    generateBtn.addEventListener(
      'click',
      async () => {

        const password =
          passwordInput.value;

        if (!password) {
          status.textContent =
            'Введите пароль.';
          result.classList.add(
            'hidden'
          );
          return;
        }

        if (password.length < 6) {
          status.textContent =
            'Пароль должен содержать минимум 6 символов.';
          result.classList.add(
            'hidden'
          );
          return;
        }

        generateBtn.disabled = true;

        status.textContent =
          'Генерируем hash...';

        result.classList.add(
          'hidden'
        );

        try {

          const data =
            await hashPassword(
              password
            );

          saltOutput.textContent =
            data.salt;

          hashOutput.textContent =
            data.hash;

          result.classList.remove(
            'hidden'
          );

          status.textContent =
            'Готово. Пароль можно очистить.';

          passwordInput.value = '';

        } catch (error) {

          console.error(error);

          status.textContent =
            'Ошибка генерации hash.';

        } finally {

          generateBtn.disabled = false;

        }

      }
    );

  </script>

</body>
</html>
